name: Build & Release AGRak

# Branches and pull requests build artifacts; only new version tags publish releases.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agrak-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK and native libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION='25.2.9519653'
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -f "$NDK_PATH/build/cmake/android.toolchain.cmake" ]; then
            echo y | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          fi
          test -f "$NDK_PATH/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Check release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          expected_version="${GITHUB_REF_NAME#v}"
          app_version="$(awk -F '"' '/^[[:space:]]*versionName / {print $2; exit}' app/build.gradle)"
          if [ -z "$app_version" ] || [ "$expected_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $app_version"
            exit 1
          fi

      - name: Grant build script permissions
        run: chmod +x gradlew build_native.sh

      - name: Compile native libraries from source
        run: ./build_native.sh

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage artifacts and SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 app/build/outputs/apk/release/app-release.apk release_assets/AGRak.apk
          cd release_assets
          sha256sum AGRak.apk libraksamp-arm64-v8a.so libraksamp-armeabi-v7a.so libraksamp-android.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Retain exact build outputs in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: agrak-${{ github.sha }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest build provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download original build artifact
        uses: actions/download-artifact@v5
        with:
          name: agrak-${{ github.sha }}
          path: release_assets

      - name: Verify checksums
        working-directory: release_assets
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest exact distributable files
        uses: actions/attest@v4
        with:
          subject-path: 'release_assets/*'

  release:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download original build artifact (do not rebuild)
        uses: actions/download-artifact@v5
        with:
          name: agrak-${{ github.sha }}
          path: release_assets

      - name: Verify tag, commit, and artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$GITHUB_SHA" ] || [ "$checkout_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag, checkout, and workflow commit disagree"
            exit 1
          fi
          cd release_assets
          sha256sum -c SHA256SUMS.txt

      - name: Publish new release without replacing existing assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite assets"
            exit 1
          fi

          {
            printf 'Built from commit [`%s`](%s/%s/commit/%s).\n\n' "${GITHUB_SHA:0:7}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'Build and verification: [%s](%s/%s/actions/runs/%s).\n\n' "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Download `SHA256SUMS.txt` to verify the APK and native libraries.\n'
          } > release_notes.md

          gh release create "$TAG" release_assets/* \
            --title "AGRak Android $TAG" \
            --notes-file release_notes.md \
            --verify-tag \
            --latest
